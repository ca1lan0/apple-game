function rr(x,c,y,w,h,r){x.beginPath();x.moveTo(c+r,y);x.arcTo(c+w,y,c+w,y+h,r);x.arcTo(c+w,y+h,c,y+h,r);x.arcTo(c,y+h,c,y,r);x.arcTo(c,y,c+w,y,r);x.closePath()}
function wrap(x,t,maxW){const out=[];let line='';for(const w of t.split(' ')){const tt=line?line+' '+w:w;if(x.measureText(tt).width>maxW&&line){out.push(line);line=w}else line=tt}out.push(line);return out}
function drawCard(cv,d){
 const W=1080,H=1350;cv.width=W;cv.height=H;const x=cv.getContext('2d');
 let g=x.createLinearGradient(0,0,W*.4,H);g.addColorStop(0,'#ecc4cd');g.addColorStop(.55,'#dba3b0');g.addColorStop(1,'#c98a9a');x.fillStyle=g;x.fillRect(0,0,W,H);
 [[.18,.1,.6,'#fbeef1'],[.9,.3,.5,'#e8b4bf'],[.5,1.05,.7,'#b5677a']].forEach(([cx,cy,r,col])=>{const rg=x.createRadialGradient(cx*W,cy*H,0,cx*W,cy*H,r*W);rg.addColorStop(0,col);rg.addColorStop(1,col+'00');x.fillStyle=rg;x.fillRect(0,0,W,H)});
 x.textBaseline='alphabetic';
 x.fillStyle='rgba(255,255,255,.55)';rr(x,90,75,900,64,32);x.fill();
 [['#d98fa0',128],['#e8b4bf',160],['#f3d6dc',192]].forEach(([c,cx])=>{x.fillStyle=c;x.beginPath();x.arc(cx,107,10,0,7);x.fill()});
 x.fillStyle='#4b3a40';x.font='600 26px '+F;x.textAlign='center';x.fillText(d.file,W/2,116);
 const L=90,T=170,CW=900,CH=1000;
 x.fillStyle='#fff';rr(x,L,T,CW,CH,40);x.fill();x.strokeStyle='#efd3da';x.lineWidth=2;x.stroke();
 x.textAlign='left';x.fillStyle='#9a8287';x.font='600 22px '+F;
 x.fillText(d.ch,L+70,T+90);
 x.fillStyle='#7e3f50';x.font='800 50px '+F;x.fillText(d.ct,L+70,T+160);
 x.fillStyle='#efd3da';x.fillRect(L+70,T+200,CW-140,2);
 const sp=String(d.spd);x.font='700 52px '+F;const uw=x.measureText('타/분').width;let fs=230;x.font='800 '+fs+'px '+F;while(x.measureText(sp).width>CW-150-uw-20&&fs>120){fs-=10;x.font='800 '+fs+'px '+F}x.fillStyle='#8e4a5c';x.fillText(sp,L+60,T+430);
 const nw=x.measureText(sp).width;x.fillStyle='#9a8287';x.font='700 52px '+F;x.fillText('타/분',L+70+nw+10,T+430);
 x.font='700 40px '+F;const rkw=x.measureText(d.rk).width+70;x.fillStyle='#8e4a5c';rr(x,L+70,T+475,rkw,72,36);x.fill();x.fillStyle='#fff';x.fillText(d.rk,L+105,T+525);
 const st=[['정확도',d.acc+'%'],['걸린 시간',d.time],['오타',d.errs+'번']];const bw=(CW-140-40)/3;
 st.forEach(([k,v],i)=>{const bx=L+70+i*(bw+20),by=T+600;x.fillStyle='#fbeef1';rr(x,bx,by,bw,150,26);x.fill();x.fillStyle='#9a8287';x.font='600 26px '+F;x.fillText(k,bx+30,by+52);x.fillStyle='#7e3f50';x.font='800 50px '+F;x.fillText(v,bx+30,by+118)});
 const by=T+840;x.font='500 32px '+F;const lines=wrap(x,d.cm,600);const bh=lines.length*46+40,bwid=Math.max(...lines.map(l=>x.measureText(l).width))+56;
 const bx2=L+150,by2=by;x.fillStyle='#e9e9eb';x.beginPath();x.moveTo(bx2+34,by2);x.arcTo(bx2+bwid,by2,bx2+bwid,by2+bh,34);x.arcTo(bx2+bwid,by2+bh,bx2,by2+bh,34);x.arcTo(bx2,by2+bh,bx2,by2,8);x.arcTo(bx2,by2,bx2+bwid,by2,34);x.closePath();x.fill();
 x.fillStyle='#1d1d1f';lines.forEach((l,i)=>x.fillText(l,bx2+28,by2+52+i*46));
 x.fillStyle='#9a8287';x.font='600 22px '+F;x.fillText('Callan',bx2+6,by2-14);
 const ay=by2+bh-32;const ag=x.createLinearGradient(L+70,ay-32,L+134,ay+32);ag.addColorStop(0,'#d29aa7');ag.addColorStop(1,'#8e4a5c');x.fillStyle=ag;x.beginPath();x.arc(L+102,ay,32,0,7);x.fill();
 x.fillStyle='#fff';x.font='800 30px '+F;x.textAlign='center';x.fillText('C',L+102,ay+11);x.textAlign='left';
 x.save();x.translate(L+CW-160,T+150);x.rotate(-0.22);x.globalAlpha=.85;x.strokeStyle='#6e1f33';x.fillStyle='#6e1f33';
 x.lineWidth=6;x.beginPath();x.arc(0,0,105,0,7);x.stroke();x.lineWidth=2.5;x.beginPath();x.arc(0,0,90,0,7);x.stroke();
 x.textAlign='center';x.font='800 34px '+F;x.fillText(d.stamp,0,-8);x.fillRect(-70,8,140,3);x.font='700 21px '+F;x.fillText("C. O'CONNOR",0,42);x.font='700 16px '+F;x.fillText('No.10',0,-52);x.restore();x.textAlign='left';
 x.fillStyle='rgba(255,255,255,.92)';x.font='700 28px '+F;x.textAlign='center';x.fillText(d.ft,W/2,T+CH+70);
 x.fillStyle='rgba(255,255,255,.75)';x.font='600 22px '+F;x.fillText("Sophia's iMac  ·  "+d.date,W/2,T+CH+112);x.textAlign='left';
}
const muBtn=()=>$('mu').classList.toggle('off',muted);
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function say(t,ms){$('bt').textContent=t;$('bub').classList.add('on');clearTimeout(bubT);bubT=setTimeout(()=>$('bub').classList.remove('on'),ms||2200)}
function build(){const re=mode==='re';doc.classList.toggle('re',re);doc.innerHTML=CUR.map((l,i)=>(!re&&i===CUR.length-1?'<div class="bn" id="bn"><i>C</i>캘런이 마지막 줄을 몰래 추가했어요</div>':'')+`<p class="ln${!re&&i===CUR.length-1?' bonus':''}${re?' me':''}" id="l${i}">${esc(l)}</p>`+(re?`<p class="ln cl" id="r${i}">${esc(REP[i])}</p>`:'')).join('')+(re?'<div class="ty" id="ty"><i></i><i></i><i></i></div>':'')}
function paint(){
 CUR.forEach((l,i)=>{const e=$('l'+i);e.classList.toggle('done',i<cur);e.classList.toggle('cur',i===cur&&playing);if(i!==cur)e.textContent=l});
 if(cur>=CUR.length)return;
 const tg=[...CUR[cur]],v=[...inp.value];let h='';let anyBad=false;
 for(let i=0;i<tg.length;i++){
  let cl='c';
  if(i<v.length){const last=i===v.length-1;if(v[i]===tg[i])cl='o';else if(last&&comp)cl='p';else{cl='x';anyBad=true}}
  if(i===v.length)cl+=' k';
  h+=`<span class="${cl}">${esc(tg[i])}</span>`;
 }
 if(v.length>tg.length){h+=`<span class="x">${esc(v.slice(tg.length).join(''))}</span>`;anyBad=true}
 $('l'+cur).innerHTML=h;inp.classList.toggle('bad',anyBad);
 return anyBad;
}
function firstBad(){const tg=[...CUR[cur]],v=[...inp.value];const n=comp?v.length-1:v.length;for(let i=0;i<n;i++)if(v[i]!==tg[i])return i;return -1}
function correctPrefix(){const tg=[...CUR[cur]],v=[...inp.value];let k=0;while(k<v.length&&k<tg.length&&v[k]===tg[k])k++;return sks(tg.slice(0,k).join(''))}
function stats(){
 const sec=t0?(performance.now()-t0)/1000:0;const tot=strokes+(cur<CUR.length?correctPrefix():0);
 const spd=sec>1?Math.round(tot*60/sec):0;const acc=keys?Math.max(0,Math.round((keys-errs)/keys*100)):100;
 $('spd').innerHTML=spd+'<small>타</small>';$('acc').innerHTML=acc+'<small>%</small>';$('prg').textContent=cur+'/'+CUR.length;
 return{spd,acc,sec};
}
function onInput(){
 if(!playing)return;
 if(!t0)t0=performance.now();
 keys++;sfx.key();
 paint();
 const fb=firstBad();
 if(fb>=0&&fb!==lastBad){errs++;sfx.bad();const T=MODES[mode].typo;if(mode==='re'){if(Math.random()<.6)spam(T[Math.floor(Math.random()*T.length)])}else if(Math.random()<.75)say(T[Math.floor(Math.random()*T.length)])}
 lastBad=fb;
 if(!comp&&inp.value===CUR[cur])next();
 stats();
}
function next(){
 strokes+=sks(CUR[cur]);cur++;inp.value='';lastBad=-1;sfx.line();
 if(mode==='re'){const k=cur-1,ty=$('ty'),last=cur>=CUR.length;prs=Math.max(0,prs-4);setPrs();(k+1<CUR.length?$('l'+(k+1)).before(ty):$('l'+k).after(ty));ty.classList.add('on');setTimeout(()=>{ty.classList.remove('on');const r=$('r'+k);if(k+1<CUR.length)$('l'+(k+1)).before(r);r.classList.add('on');sfx.recv();scrollEl(r);if(last)setTimeout(()=>{const f=document.createElement('p');f.className='ln cl on';f.textContent=FINAL;doc.appendChild(f);sfx.recv();scrollEl(f)},1300)},700+REP[k].length*25)}
 if(cur>=CUR.length){finish();return}
 if(mode==='v8'){if(cur===CUR.length-1){$('bn').classList.add('on');say('…그 줄은 지우지 마. 진심이니까.',3200)}
 else if(cur===3)say(DONE[2]);else say(DONE[Math.floor(Math.random()*2)])}
 paint();scrollCur();
}
function scrollCur(){scrollEl(mode==='v8'&&cur===CUR.length-1?$('bn'):$('l'+cur))}
function scrollEl(e){if(!e)return;const pg=$('pg'),er=e.getBoundingClientRect(),pr=pg.getBoundingClientRect();if(er.top<pr.top+8||er.bottom>pr.bottom-100)pg.scrollTo({top:pg.scrollTop+er.top-pr.top-pr.height/3,behavior:'smooth'})}
function finish(){
 playing=false;clearTimeout(spT);const {spd,acc,sec}=stats();inp.blur();$('bub').classList.remove('on');
 let rk,cm;const v8=mode==='v8';
 if(spd<100){rk='🦅 독수리 인증';cm=v8?'손가락 두 개로 끝까지 친 건 인정. 고생했어.':'…다음엔 그냥 전화해.'}
 else if(spd<200){rk='🐣 아기 독수리';cm=v8?'느려. 근데 귀여우니까 봐준다.':'답장 하나에 이렇게 오래 걸려? 빨리 타.'}
 else if(spd<320){rk='💼 홍보팀 막내';cm=v8?'오, 생각보다 치는데? 홍보팀 맞네.':'오, 빨리 왔네. 뛰어왔지?'}
 else{rk='⚡ 프리야 씨 급';cm=v8?'뭐야, 너 평소엔 일부러 천천히 쳤냐?':'뭐야, 벌써 왔어?'}
 let first=false;if(v8&&!unlocked){first=true;unlocked=true;try{localStorage.setItem('tp-unlock','1')}catch(e){}}
 $('nw').textContent=first?'💌 새 모드가 열렸어요: 캘런에게 답장':'';$('toRe').hidden=!v8;lockUI();
 if(acc<85)cm+=' 근데 오타는 좀 줄이자.';
 const m=Math.floor(sec/60),s=Math.round(sec%60);
 $('fs').innerHTML=spd+'<small>타/분</small>';$('rk').textContent=rk;
 $('fd').textContent=`정확도 ${acc}% · 걸린 시간 ${m?m+'분 ':''}${s}초 · 오타 ${errs}번`;
 $('fc').textContent=cm;$('et').textContent=v8?'작성 완료 📄':'전송 완료 💌';setTimeout(()=>{$('end').hidden=false;sfx.end()},v8?0:4800);
 res=Object.assign({spd,rk,acc,time:(m?m+'분 ':'')+s+'초',errs,cm,stamp:v8?'APPROVED':'READ'},MODES[mode]);
}
function begin(m){
 mode=m||mode;CUR=MODES[mode].lines;const M=MODES[mode];$('fnm').textContent=M.file;$('ph').textContent=M.ph;$('pt').textContent=M.pt;$('dl').setAttribute('download',M.dl);
 cur=0;t0=0;strokes=0;keys=0;errs=0;lastBad=-1;comp=false;playing=true;inp.value='';$('pv').hidden=true;$('ft').hidden=true;clearTimeout(spT);prs=0;setPrs();
 $('start').hidden=true;$('end').hidden=true;$('eg').textContent=mode==='v8'?'🦅 소피아는 독수리 타법이에요. 천천히 정확하게!':'📳 캘런 메시지가 '+PMAX+'개 쌓이면 전화가 와요. 빨리 보내요!';inp.placeholder=mode==='v8'?'여기에 그대로 따라 치세요':'iMessage';
 build();paint();stats();actx();sfx.start();inp.focus({preventScroll:true});$('pg').scrollTop=0;
 if(mode==='v8')setTimeout(()=>say('진짜 네가 직접 쳐? 손가락 두 개로?',2600),500);else{setTimeout(()=>{if(playing)spam('어디야')},700);spamLoop()}
}
inp.addEventListener('compositionstart',()=>{comp=true});
inp.addEventListener('compositionend',()=>{comp=false;setTimeout(()=>{if(!playing)return;paint();if(inp.value===CUR[cur])next();stats()},0)});
inp.addEventListener('input',e=>{comp=!!e.isComposing||comp;onInput()});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&playing){e.preventDefault();if(inp.value.trim()===CUR[cur])next();else{sfx.bad();say('아직 다 안 쳤잖아.')}}});
setInterval(()=>{if(playing&&t0)stats()},500);
$('mu').onclick=()=>{muted=!muted;try{localStorage.setItem('tp-mute',muted?'1':'0')}catch(e){}muBtn();if(!muted){actx();sfx.key()}};muBtn();
$('save').onclick=()=>{if(!res)return;const cv=document.createElement('canvas');const d=new Date();drawCard(cv,Object.assign({date:d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')},res));const u=cv.toDataURL('image/png');$('pvi').src=u;$('dl').href=u;$('pv').hidden=false;sfx.line()};
$('pvx').onclick=()=>{$('pv').hidden=true};
function setPrs(){const e=$('prs');e.hidden=mode!=='re';e.textContent='📳 '+prs+'/'+PMAX;e.classList.toggle('hot',prs>=PMAX-3)}
function spam(t){if(!playing)return;const p=document.createElement('p');p.className='ln cl on sp';p.textContent=t;const ref=$('l'+cur);ref?doc.insertBefore(p,ref):doc.appendChild(p);prs++;sfx.buzz();setPrs();scrollEl(ref||p);if(prs>=PMAX)over()}
function spamLoop(){clearTimeout(spT);if(!playing||mode!=='re')return;const el=t0?Math.min(1,(performance.now()-t0)/90000):0;spT=setTimeout(()=>{if(!playing||mode!=='re')return;if(t0){let i;do{i=Math.floor(Math.random()*SPAM.length)}while(i===spIdx);spIdx=i;spam(SPAM[i])}spamLoop()},4400-1900*el+Math.random()*1300)}
function over(){playing=false;clearTimeout(spT);inp.blur();$('bub').classList.remove('on');$('ftt').textContent='FaceTime 영상…';$('fb').hidden=false;$('fcm').hidden=true;$('fre').hidden=true;$('ft').hidden=false;sfx.ring()}
function pick(t){$('fb').hidden=true;$('ftt').textContent=t[0];$('fct').textContent=t[1];$('fcm').hidden=false;$('fre').hidden=false}
$('fup').onclick=()=>pick(['연결됨 · 00:03','타자로 할 거면 그냥 전화 받아.']);$('fdn').onclick=()=>{sfx.bad();pick(['통화 거절함','거절? 지금 올라간다.'])};
$('ftr').onclick=()=>begin('re');$('ftx').onclick=()=>{$('ft').hidden=true;$('start').hidden=false};
function lockUI(){const b=$('go2');b.classList.toggle('lk',!unlocked);b.textContent=unlocked?'💌 캘런에게 답장':'🔒 캘런에게 답장';$('lkm').textContent=unlocked?'':'사과문 v8을 끝까지 치면 답장 모드가 열려요'}
$('go').onclick=()=>begin('v8');$('go2').onclick=()=>{if(!unlocked){actx();sfx.bad();return}begin('re')};$('again').onclick=()=>begin(mode);$('toRe').onclick=()=>begin('re');lockUI();
build();paint();
})();
