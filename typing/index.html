}
function firstBad(){const tg=[...LINES[cur]],v=[...inp.value];const n=comp?v.length-1:v.length;for(let i=0;i<n;i++)if(v[i]!==tg[i])return i;return -1}
function correctPrefix(){const tg=[...LINES[cur]],v=[...inp.value];let k=0;while(k<v.length&&k<tg.length&&v[k]===tg[k])k++;return sks(tg.slice(0,k).join(''))}
function stats(){
 const sec=t0?(performance.now()-t0)/1000:0;const tot=strokes+(cur<LINES.length?correctPrefix():0);
 const spd=sec>1?Math.round(tot*60/sec):0;const acc=keys?Math.max(0,Math.round((keys-errs)/keys*100)):100;
 $('spd').innerHTML=spd+'<small>타</small>';$('acc').innerHTML=acc+'<small>%</small>';$('prg').textContent=cur+'/'+LINES.length;
 return{spd,acc,sec};
}
function onInput(){
 if(!playing)return;
 if(!t0)t0=performance.now();
 keys++;sfx.key();
 paint();
 const fb=firstBad();
 if(fb>=0&&fb!==lastBad){errs++;sfx.bad();if(Math.random()<.75)say(TYPO[Math.floor(Math.random()*TYPO.length)])}
 lastBad=fb;
 if(!comp&&inp.value===LINES[cur])next();
 stats();
}
function next(){
 strokes+=sks(LINES[cur]);cur++;inp.value='';lastBad=-1;sfx.line();
 if(cur>=LINES.length){finish();return}
 if(cur===LINES.length-1){$('bn').classList.add('on');say('…그 줄은 지우지 마. 진심이니까.',3200)}
 else if(cur===3)say(DONE[2]);else say(DONE[Math.floor(Math.random()*2)]);
 paint();scrollCur();
}
function scrollCur(){const e=cur===LINES.length-1?$('bn'):$('l'+cur);if(!e)return;const pg=$('pg'),er=e.getBoundingClientRect(),pr=pg.getBoundingClientRect();if(er.top<pr.top+8||er.bottom>pr.bottom-100)pg.scrollTo({top:pg.scrollTop+er.top-pr.top-pr.height/3,behavior:'smooth'})}
function finish(){
 playing=false;const {spd,acc,sec}=stats();inp.blur();sfx.end();$('bub').classList.remove('on');
 let rk,cm;
 if(spd<100){rk='🦅 독수리 인증';cm='손가락 두 개로 끝까지 친 건 인정. 고생했어.'}
 else if(spd<200){rk='🐣 아기 독수리';cm='느려. 근데 귀여우니까 봐준다.'}
 else if(spd<320){rk='💼 홍보팀 막내';cm='오, 생각보다 치는데? 홍보팀 맞네.'}
 else{rk='⚡ 프리야 씨 급';cm='뭐야, 너 평소엔 일부러 천천히 쳤냐?'}
 if(acc<85)cm+=' 근데 오타는 좀 줄이자.';
 const m=Math.floor(sec/60),s=Math.round(sec%60);
 $('fs').innerHTML=spd+'<small>타/분</small>';$('rk').textContent=rk;
 $('fd').textContent=`정확도 ${acc}% · 걸린 시간 ${m?m+'분 ':''}${s}초 · 오타 ${errs}번`;
 $('fc').textContent=cm;$('end').hidden=false;
 res={spd,rk,acc,time:(m?m+'분 ':'')+s+'초',errs,cm};
}
function begin(){
 cur=0;t0=0;strokes=0;keys=0;errs=0;lastBad=-1;comp=false;playing=true;inp.value='';
 $('start').hidden=true;$('end').hidden=true;$('eg').textContent='🦅 소피아는 독수리 타법이에요. 천천히 정확하게!';
 build();paint();stats();actx();sfx.start();inp.focus({preventScroll:true});$('pg').scrollTop=0;
 setTimeout(()=>say('진짜 네가 직접 쳐? 손가락 두 개로?',2600),500);
}
inp.addEventListener('compositionstart',()=>{comp=true});
inp.addEventListener('compositionend',()=>{comp=false;setTimeout(()=>{if(!playing)return;paint();if(inp.value===LINES[cur])next();stats()},0)});
inp.addEventListener('input',e=>{comp=!!e.isComposing||comp;onInput()});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&playing){e.preventDefault();if(inp.value.trim()===LINES[cur])next();else{sfx.bad();say('아직 다 안 쳤잖아.')}}});
setInterval(()=>{if(playing&&t0)stats()},500);
$('mu').onclick=()=>{muted=!muted;try{localStorage.setItem('tp-mute',muted?'1':'0')}catch(e){}muBtn();if(!muted){actx();sfx.key()}};muBtn();
$('save').onclick=()=>{if(!res)return;const cv=document.createElement('canvas');const d=new Date();drawCard(cv,Object.assign({date:d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')},res));const u=cv.toDataURL('image/png');$('pvi').src=u;$('dl').href=u;$('pv').hidden=false;sfx.line()};
$('pvx').onclick=()=>{$('pv').hidden=true};
$('go').onclick=begin;$('again').onclick=begin;
build();paint();
})();
</script>
</body>
</html>
