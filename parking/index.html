 x.drawImage(img,sx,sy);
 drawPillars();
 if(hd&&playing){x.globalAlpha=.4;x.drawImage(img,sx,sy);x.globalAlpha=1}
 if(flash>0){x.fillStyle='rgba(255,255,255,'+flash+')';x.fillRect(0,0,W,H);flash=Math.max(0,flash-.05)}
}
function fit(){const s=$('st'),k=Math.max(1,Math.floor(Math.min(s.clientWidth/W,s.clientHeight/H)*4)/4);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
const actx=()=>{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ac=new A()}if(ac.state==='suspended')ac.resume();return ac};
function tone(f,d,o={}){if(muted)return;const a=actx();if(!a)return;const t=a.currentTime+(o.at||0);const g=a.createGain(),v=a.createOscillator();v.type=o.type||'square';v.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.08,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);v.connect(g).connect(a.destination);v.start(t);v.stop(t+d+.02)}
function noise(d,vol){if(muted)return;const a=actx();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol;s.connect(g).connect(a.destination);s.start()}
const sfx={step(){tone(110+Math.random()*20,.04,{vol:.05})},turn(){tone(660,.07,{vol:.06});tone(880,.09,{at:.08,vol:.06})},shutter(){noise(.14,.45);tone(1760,.04,{at:.03,vol:.05})},clear(){[523,659,784].forEach((f,i)=>tone(f,.12,{at:i*.08,vol:.07}))},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,{at:i*.09,vol:.07}))}};
const muBtn=()=>$('mu').classList.toggle('off',muted);
const rnd=([a,b])=>a+Math.random()*(b-a);
function say(t,ms){const h=$('hint');h.dataset.say=1;h.textContent='C: '+t;clearTimeout(sayT);sayT=setTimeout(()=>{delete h.dataset.say;setHint()},ms||2200)}
function setHint(){const h=$('hint');if(h.dataset.say)return;if(playing&&hiddenNow()){h.textContent='기둥 뒤 숨는 중';return}h.textContent=state==='safe'?'기자 등 돌림':state==='look'?'보는 중! 멈춰':'!? 돌아본다'}
function setState(s,dur){state=s;stT=performance.now()+dur*1000;if(s==='look')lookAt=performance.now();if(s!=='safe')delete $('hint').dataset.say;setHint();if(s==='turn'||s==='fake')sfx.turn()}
function nextState(){const S=ST[st];if(state==='safe')setState(Math.random()<S.fake?'fake':'turn',S.turn);else if(state==='turn')setState('look',rnd(S.look));else setState('safe',rnd(S.safe))}
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(playing){
  if(now>stT)nextState();
  if(holding){pxp=Math.min(1,pxp+ST[st].sp*dt);if(now>frT){frame++;frT=now+150}if(now>stepT){sfx.step();stepT=now+300}}
  const hd=hiddenNow();if(hd!==wasHid){wasHid=hd;setHint()}
  if(state==='look'&&holding&&!hd&&now-lookAt>110)caught();
  $('pb').style.width=pxp*100+'%';if(playing)$('tm').textContent=((tot+(now-t0))/1000).toFixed(1)+'s';
  if(playing&&pxp>=1)clearStage(now);
 }
 render(now);requestAnimationFrame(loop);
}
function startStage(){pxp=0;holding=false;$('hold').classList.remove('on');setState('safe',rnd(ST[st].safe)+.6);$('stg').textContent='STAGE '+(st+1)+'/3';say(ST[st].msg,2600);t0=performance.now();playing=true}
function clearStage(now){playing=false;tot+=now-t0;holding=false;$('hold').classList.remove('on');if(st<2){sfx.clear();st++;say(['오 하나 통과','좋아 거의 다 왔어'][st-1],1400);setTimeout(startStage,1200)}else win()}
function begin(){actx();st=0;tot=0;['start','caught','win'].forEach(i=>$(i).hidden=true);startStage()}
function photo(){const p=$('pc'),c=p.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#000';c.fillRect(0,0,240,80);const sx=soX();c.drawImage(cv,sx-110,H-100,240,80,0,0,240,80);const d=c.getImageData(0,0,240,80),a=d.data;for(let i=0;i<a.length;i+=4){const v=(a[i]*.3+a[i+1]*.59+a[i+2]*.11)*.82;a[i]=v;a[i+1]=v*.96;a[i+2]=v*.9}c.putImageData(d,0,0);const sy=H-SO[0].height-14-(H-100);c.fillStyle='#000';c.fillRect(110+6,sy+11,12,3)}
function caught(){playing=false;holding=false;$('hold').classList.remove('on');sfx.shutter();render(performance.now());photo();flash=1;
 const h=NEWS[Math.floor(Math.random()*NEWS.length)],d=new Date();$('nd').textContent=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' · 스포츠';$('hl').textContent=h[0];$('hb').textContent=h[1];$('hc').textContent=CC[Math.floor(Math.random()*CC.length)];setTimeout(()=>$('caught').hidden=false,700)}
function win(){sfx.win();const s=tot/1000;let rk,cm;if(s<22){rk='닌자 소피아';cm='뭐야 언제 탔어? 소리도 없이'}else if(s<32){rk='비밀 연애 고수';cm='안 들켰지? 잘했어. 벨트 매'}else if(s<45){rk='조심조심 거북이';cm='느려도 안 들켰으면 됐어'}else{rk='독수리 걸음';cm='걷는 것도 독수리 타법이냐'}
 $('wt').textContent=s.toFixed(1)+'s';$('wr').textContent=rk;$('wd').textContent='STAGE 3/3 CLEAR · 기자 3번 따돌림';$('wc').textContent=cm;$('win').hidden=false}
const down=e=>{if(!playing)return;if(e)e.preventDefault();holding=true;$('hold').classList.add('on');actx()};
const up=()=>{holding=false;$('hold').classList.remove('on')};
['hold','st'].forEach(id=>{const el=$(id);el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowRight')&&!e.repeat){e.preventDefault();down()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowRight')up()});
addEventListener('blur',up);addEventListener('resize',fit);
$('mu').onclick=()=>{muted=!muted;try{localStorage.setItem('pk-mute',muted?'1':'0')}catch(e){}muBtn();if(!muted){actx();sfx.step()}};muBtn();
$('go').onclick=begin;$('re1').onclick=begin;$('re2').onclick=begin;$('home1').onclick=()=>{$('caught').hidden=true;$('start').hidden=false};
fit();last=performance.now();requestAnimationFrame(loop);
})();
</script>
